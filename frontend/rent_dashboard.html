<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Auckland Market Rent 2025</title>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f1117; color: #e0e0e0; min-height: 100vh; }
  header { padding: 24px 32px 16px; border-bottom: 1px solid #1e2130; }
  header h1 { font-size: 22px; font-weight: 600; color: #fff; }
  header p { font-size: 13px; color: #6b7280; margin-top: 4px; }
  .controls { display: flex; gap: 16px; padding: 20px 32px; flex-wrap: wrap; align-items: flex-end; background: #0f1117; border-bottom: 1px solid #1e2130; }
  .ctrl-group { display: flex; flex-direction: column; gap: 6px; }
  label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: #6b7280; }
  select { background: #1a1d2e; border: 1px solid #2a2d3e; color: #e0e0e0; padding: 8px 12px; border-radius: 6px; font-size: 14px; cursor: pointer; min-width: 160px; }
  select:focus { outline: none; border-color: #4f6ef7; }
  .badge { display: inline-flex; align-items: center; gap: 6px; background: #1a1d2e; border: 1px solid #2a2d3e; border-radius: 6px; padding: 8px 14px; font-size: 13px; }
  .badge span { color: #4f6ef7; font-weight: 700; font-size: 18px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: #1e2130; }
  .chart-box { background: #0f1117; padding: 24px; }
  .chart-box h2 { font-size: 13px; font-weight: 600; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
  .chart-box p.sub { font-size: 12px; color: #4b5563; margin-bottom: 16px; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<header>
  <h1>Auckland Market Rent 2025</h1>
  <p>数据来源：MBIE Market Rent API · Ward 级别 · 2025年1月—12月</p>
</header>

<div class="controls">
  <div class="ctrl-group">
    <label>房型</label>
    <select id="dwell">
      <option value="House">House</option>
      <option value="Apartment">Apartment</option>
      <option value="Flat">Flat</option>
      <option value="Room">Room</option>
      <option value="Boarding House">Boarding House</option>
    </select>
  </div>
  <div class="ctrl-group">
    <label>卧室数</label>
    <select id="bedrooms">
      <option value="3">3 卧室</option>
      <option value="2">2 卧室</option>
      <option value="1">1 卧室</option>
      <option value="4">4 卧室</option>
      <option value="5">5 卧室</option>
      <option value="5+">5+ 卧室</option>
    </select>
  </div>
  <div class="ctrl-group">
    <label>月份（趋势图高亮）</label>
    <select id="period">
      <option value="2025-12">2025-12（最新）</option>
      <option value="2025-11">2025-11</option>
      <option value="2025-10">2025-10</option>
      <option value="2025-09">2025-09</option>
      <option value="2025-06">2025-06</option>
      <option value="2025-03">2025-03</option>
      <option value="2025-01">2025-01</option>
    </select>
  </div>
  <div class="ctrl-group">
    <label>指标</label>
    <select id="metric">
      <option value="median">中位数周租</option>
      <option value="lq">下四分位（便宜端）</option>
      <option value="uq">上四分位（贵端）</option>
    </select>
  </div>
</div>

<div class="grid">
  <div class="chart-box">
    <h2>各区租金对比</h2>
    <p class="sub" id="bar-sub">选定月份，按中位租金排序</p>
    <div id="bar-chart" style="height:420px"></div>
  </div>
  <div class="chart-box">
    <h2>全年趋势</h2>
    <p class="sub">2025年1—12月，各区走势</p>
    <div id="line-chart" style="height:420px"></div>
  </div>
  <div class="chart-box">
    <h2>租金区间分布</h2>
    <p class="sub" id="range-sub">LQ — 中位 — UQ（选定月份）</p>
    <div id="range-chart" style="height:420px"></div>
  </div>
  <div class="chart-box">
    <h2>活跃租约数（市场规模）</h2>
    <p class="sub" id="size-sub">nCurr：当前活跃债券数，选定月份</p>
    <div id="size-chart" style="height:420px"></div>
  </div>
</div>

const COLORS = [
  '#4f6ef7','#f7974f','#4ff7a0','#f74f6e','#c44ff7',
  '#f7d94f','#4fd4f7','#f7504f','#7af74f','#f74fd0',
  '#4fa8f7','#f7f74f','#9b4ff7'
];

const AREAS = [...new Set(RAW.map(d => d.area))].sort();
const colorMap = {};
AREAS.forEach((a, i) => colorMap[a] = COLORS[i % COLORS.length]);

const layout_base = {
  paper_bgcolor: 'rgba(0,0,0,0)',
  plot_bgcolor: 'rgba(0,0,0,0)',
  font: { color: '#9ca3af', family: '-apple-system, sans-serif', size: 12 },
  margin: { t: 20, r: 20, b: 80, l: 60 },
  xaxis: { gridcolor: '#1e2130', zerolinecolor: '#1e2130', tickfont: { size: 11 } },
  yaxis: { gridcolor: '#1e2130', zerolinecolor: '#1e2130' },
  legend: { bgcolor: 'rgba(0,0,0,0)', font: { size: 11 } },
  hoverlabel: { bgcolor: '#1a1d2e', bordercolor: '#2a2d3e', font: { color: '#e0e0e0' } },
};

function getFiltered(dwell, bedrooms, period) {
  return RAW.filter(d => d.dwell === dwell && d.bedrooms === bedrooms && d.period === period);
}

function getAllPeriods(dwell, bedrooms) {
  return RAW.filter(d => d.dwell === dwell && d.bedrooms === bedrooms);
}

function update() {
  const dwell = document.getElementById('dwell').value;
  const bedrooms = document.getElementById('bedrooms').value;
  const period = document.getElementById('period').value;
  const metric = document.getElementById('metric').value;
  const metricLabel = { median: '中位周租 $NZD', lq: '下四分位 $NZD', uq: '上四分位 $NZD' }[metric];

  const filtered = getFiltered(dwell, bedrooms, period);
  filtered.sort((a, b) => (b[metric] || 0) - (a[metric] || 0));

  // Bar chart
  Plotly.react('bar-chart', [{
    type: 'bar',
    x: filtered.map(d => d.area),
    y: filtered.map(d => d[metric]),
    marker: { color: filtered.map(d => colorMap[d.area]) },
    text: filtered.map(d => `$${d[metric]}`),
    textposition: 'outside',
    hovertemplate: '<b>%{x}</b><br>' + metricLabel + ': $%{y}/wk<extra></extra>',
  }], {
    ...layout_base,
    yaxis: { ...layout_base.yaxis, title: metricLabel, tickprefix: '$' },
    xaxis: { ...layout_base.xaxis, tickangle: -35 },
    margin: { ...layout_base.margin, b: 110 },
  }, { responsive: true });

  // Line chart
  const allData = getAllPeriods(dwell, bedrooms);
  const periods = [...new Set(allData.map(d => d.period))].sort();
  const lineTraces = AREAS.map(area => {
    const pts = periods.map(p => {
      const row = allData.find(d => d.area === area && d.period === p);
      return row ? row[metric] : null;
    });
    return {
      type: 'scatter', mode: 'lines+markers',
      name: area, x: periods, y: pts,
      line: { color: colorMap[area], width: 2 },
      marker: { size: 5, color: colorMap[area] },
      hovertemplate: '<b>' + area + '</b><br>%{x}: $%{y}/wk<extra></extra>',
    };
  });

  Plotly.react('line-chart', lineTraces, {
    ...layout_base,
    yaxis: { ...layout_base.yaxis, tickprefix: '$' },
    legend: { ...layout_base.legend, orientation: 'v', x: 1.02, y: 1 },
    margin: { t: 20, r: 140, b: 60, l: 60 },
  }, { responsive: true });

  // Range chart (LQ-median-UQ error bars)
  const rangeData = getFiltered(dwell, bedrooms, period);
  rangeData.sort((a, b) => (b.median || 0) - (a.median || 0));

  Plotly.react('range-chart', [{
    type: 'scatter', mode: 'markers',
    name: '中位数',
    x: rangeData.map(d => d.area),
    y: rangeData.map(d => d.median),
    error_y: {
      type: 'data', symmetric: false,
      array: rangeData.map(d => d.uq - d.median),
      arrayminus: rangeData.map(d => d.median - d.lq),
      color: '#4f6ef7', thickness: 2, width: 6,
    },
    marker: { color: '#fff', size: 8, line: { color: '#4f6ef7', width: 2 } },
    hovertemplate: '<b>%{x}</b><br>中位: $%{y}/wk<extra></extra>',
  }], {
    ...layout_base,
    yaxis: { ...layout_base.yaxis, tickprefix: '$', title: '周租 $NZD' },
    xaxis: { ...layout_base.xaxis, tickangle: -35 },
    margin: { ...layout_base.margin, b: 110 },
  }, { responsive: true });

  // Market size chart
  const sizeData = getFiltered(dwell, bedrooms, period);
  sizeData.sort((a, b) => (b.nCurr || 0) - (a.nCurr || 0));

  Plotly.react('size-chart', [{
    type: 'bar',
    x: sizeData.map(d => d.area),
    y: sizeData.map(d => d.nCurr),
    marker: { color: sizeData.map(d => colorMap[d.area]), opacity: 0.8 },
    hovertemplate: '<b>%{x}</b><br>活跃租约: %{y}<extra></extra>',
  }], {
    ...layout_base,
    yaxis: { ...layout_base.yaxis, title: '活跃租约数' },
    xaxis: { ...layout_base.xaxis, tickangle: -35 },
    margin: { ...layout_base.margin, b: 110 },
  }, { responsive: true });
}

['dwell','bedrooms','period','metric'].forEach(id => {
  document.getElementById(id).addEventListener('change', update);
});

update();
</script>
